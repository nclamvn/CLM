# Chuoi cong CNCLData · TIP-04
#
# VI SAO CO (25/08/2026): truoc hom nay khong kho nao co CI. 36 o cong phu thuoc MOT NGUOI NHO
# GO MOT LENH. Do la rui ro (c) trong 01_NHA_MAY_TINH_LOC.md, va no chan duong toi nen tang
# nhieu ben: them nguoi ma ky luat van nam trong thoi quen thi ky luat loang theo toc do tuyen.
#
# PHAM VI CO Y HEP, va day la cho phai doc ky:
#
#   Chuoi cong day du can CA BA KHO (CNCLData, CaoLocMatch, .touch) cung luc, ma ba kho la ba
#   repo RIENG TU. Checkout cheo repo rieng tu doi mot PAT dat lam secret, va Blueprint da chot
#   "khong dua secret nao vao workflow". Nen workflow nay CHI chay cac cong song duoc voi mot
#   kho, va no NOI RO cac cong con lai chua duoc chay o day.
#
#   KHONG chay o day: fail_closed va rang_khai_canh (can du ba kho, thieu kho thi chung tra
#   KHONG CHAY DUOC chu khong bao sach), toan bo phan CaoLocMatch va .touch.
#
#   Day la mot khoang trong CO Y, ghi ra chu khong giau. Muon dong no thi phai quyet chuyen
#   secret, va do la quyet dinh cua nguoi.

name: chuoi-cong

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cong-cncldata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai phu thuoc
        run: pip install pyyaml

      - name: refinery
        run: python3 methodbox/refinery.py domains/don_vi_cncl

      - name: bites cua refinery
        run: python3 methodbox/bites.py domains/don_vi_cncl

      - name: luat 3, value khong duoc vuot span
        run: python3 check_luat3.py domains/don_vi_cncl

      - name: em-dash
        run: python3 check_dash.py domains/don_vi_cncl

      - name: doi chung ban chup
        run: python3 check_snapshot_fidelity.py domains/don_vi_cncl --fresh .fidelity_fresh

      - name: do tuoi nguon
        run: python3 check_do_tuoi.py domains/don_vi_cncl

      - name: nguon co tai tro
        run: python3 check_tai_tro.py domains/don_vi_cncl

      - name: tham chieu treo
        run: python3 check_tham_chieu_treo.py domains/don_vi_cncl

      - name: du dieu kien
        run: python3 check_du_dieu_kien.py domains/don_vi_cncl

      - name: khang dinh toi thuong
        run: python3 check_khang_dinh_toi_thuong.py domains/don_vi_cncl

      - name: ap luat deu
        run: python3 check_ap_luat_deu.py domains/don_vi_cncl

      - name: rang cua cong ap luat deu
        run: python3 bite_ap_luat_deu.py

      # Cong nao KHONG chay duoc o day thi phai NOI RA, khong duoc de nguoi doc tuong bang
      # xanh nay phu het. In ra cuoi moi lan chay, ke ca khi moi thu deu xanh.
      - name: Khoang trong con lai, in ra chu khong giau
        if: always()
        run: |
          echo "CAC CONG CHUA CHAY TRONG CI NAY, vi can nhieu hon mot kho:"
          echo "  CNCLData    fail_closed        can du 3 kho"
          echo "  CNCLData    rang_khai_canh     can du 3 kho"
          echo "  CNCLData    rang_fail_closed   can du 3 kho"
          echo "  CaoLocMatch 5 o                 can CNCLData de dung domain dan xuat"
          echo "  .touch      7 o                 can ca CNCLData lan CaoLocMatch"
          echo ""
          echo "Muon dong khoang trong nay phai quyet chuyen PAT cho checkout cheo repo rieng tu."
          echo "Chua quyet thi day la mot phan chuoi cong VAN PHAI CHAY BANG TAY tren may that:"
          echo "  cd CaoLocMatch && ./chay_het_cong.sh"
