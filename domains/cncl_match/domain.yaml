# Domain DAN XUAT · lat cat doc CNCL (TIP-CNCL-3A, pre-reg 10_PRE_REG_SELF.md).
# Khong phai domain goc: claims.jsonl duoc SINH RA bang build_cncl_match.py tu hai
# registry da qua cong:
#   CUNG · /Users/os/CNCLData/domains/don_vi_cncl        (101 claim, 24 don vi, 5 nhom)
#   CAU  · KnowledgeBase/Dataset_CongNgheChienLuoc       (124 claim tier A, QD 21/2026)
# Snapshot duoc copy nguyen van tu hai registry nguon, span khong doi mot ky tu.
# Muon dung lai: chay build_cncl_match.py, khong sua tay claims.jsonl.
domain: cncl_match
entity_label: "Cung: don vi VN co nang luc theo nhom cong nghe chien luoc. Cau: san pham chien luoc quoc gia can lam chu (QD 21/2026/QD-TTg)"

schema:
  type_field: entity_type
  fields:
    - entity_name
    - entity_type          # cung | cau
    - capability           # ben CUNG: nang luc da co bang chung
    - capability_2         # mo ta nang luc thu hai (tu nang_luc_mo_ta_2 ben CUNG)
    - capability_3         # manh 2 cua nang luc ghep, tach o dau cham phay (TIP-3G)
    - capability_4         # manh 3 cua nang luc ghep
    - nhom                 # nhom CNCL chinh cua don vi CUNG, dung de NEO o rule v2
    - nhom_phu_3
    - nhom_phu_6
    - san_pham            # ma SP chien luoc don vi CUNG phu, dung de NEO o rule v4
    - san_pham_phu_P23
    - need                 # ben CAU: nhu cau cong nghe cua quoc gia
    - need_2               # manh thu hai cua nhu cau ghep (tach o dau cham phay ban goc)
    - capacity
    - certification
    - location
    - contact_channel
    - source_url
    - captured_at

rollup_field: entity_type

universe:
  estimate: 95
  basis: "Ke thua universe cua registry CUNG don_vi_cncl (95, co so tier A cho nhom 6). Ben CAU co mau so dong: 30 san pham chien luoc theo QD 21/2026. Coverage chi mang tinh chi bao."

refresh_days:
  default: 180

alias_map: {}

ambiguous_clusters: [["Viettel High Tech", "Viettel AI", "Tập đoàn Viettel"], ["VinAI", "VinBigData"], ["FPT", "FPT Semiconductor", "Nhà máy Kiểm thử và Đóng gói tiên tiến chip bán dẫn FPT"], ["CT Group", "CT Semiconductor"], ["VNPT", "VNPT Technology"]]
